name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
          - development

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (${{ github.event.inputs.profile || 'preview' }})
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --no-wait

      - name: Link do build
        run: echo "Acompanhe o build em https://expo.dev/accounts/[sua-conta]/projects/montador_moveis_app/builds"
